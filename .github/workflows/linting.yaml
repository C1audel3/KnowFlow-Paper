name: Linting and Formatting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint tools
        run: python -m pip install ruff==0.6.4
      - name: Lint application, tools, and tests
        run: python -m ruff check app ui scripts tests
      - name: Check formatting
        run: python -m ruff format --check app ui scripts tests
